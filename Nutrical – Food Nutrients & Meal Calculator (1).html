.brand,.pill{font:inherit;border:0;cursor:pointer;color:var(--ink);background:none}
.brand{font-weight:800;font-size:1.35rem;letter-spacing:-.02em;padding:0}

.pill{background:var(--brand);color:#fff;font-weight:600;padding:8px 16px;border-radius:999px}
main{max-width:820px;margin:0 auto;padding:20px 18px 56px}
h1,h2,h3{letter-spacing:-.02em;line-height:1.1}
h1{font-size:clamp(2rem,7vw,3rem);font-weight:800;margin:0 0 10px}
h2{font-size:1.5rem;margin:0 0 12px}
.sub{color:var(--mute);margin:0 0 16px}

.hero.col{display:flex;align-items:center;gap:18px;flex-wrap:wrap;background:var(--c);background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 65%,#000))}
.hero h1{margin:0}.hero p{margin:6px 0 0;opacity:.95}
.hero .big{font-size:4.2rem;line-height:1}
.kick{display:inline-block;font-weight:600;background:rgba(255,255,255,.2);padding:4px 12px;border-radius:999px;margin-bottom:12px}
.hero>p{max-width:520px;margin:0 0 18px;font-size:1.08rem}
.kcal{font-size:2.6rem;font-weight:800;line-height:1}
.search{width:100%;font:inherit;font-size:1.05rem;padding:15px 18px;border:2px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink)}
.hero .search{background:#fff;color:#13271b;border:0;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.search:focus-visible,.tile:focus-visible,.item:focus-visible,.back:focus-visible,.go:focus-visible,.chip:focus-visible,.qb:focus-visible,.pill:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.sec{margin-top:36px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.info{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px}
.info .ic{font-size:1.9rem}.info h3{margin:6px 0 4px;font-size:1.15rem}.info p{margin:0;color:var(--mute)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px}
.tile{aspect-ratio:1;border:0;border-radius:24px;color:#fff;font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;transition:transform .15s;background:var(--c);background:linear-gradient(150deg,var(--c),color-mix(in srgb,var(--c) 62%,#000));box-shadow:0 8px 20px rgba(0,0,0,.15)}
.tile span{font-size:clamp(2.2rem,11vw,3.4rem);line-height:1}.tile b{font-size:clamp(.95rem,3.6vw,1.3rem)}.tile small{opacity:.9}
.tile:active{transform:scale(.96)}
.t-fruits{--c:var(--fruit)}.t-veg{--c:var(--veg)}.t-base{--c:var(--base)}
.cta{margin-top:40px;border-radius:28px;padding:34px 22px;text-align:center;color:#2a1d00;background:linear-gradient(135deg,#f2b632,#f7d774)}
.cta h2{margin:0 0 6px}.cta p{margin:0 0 18px}
.go{font:inherit;font-weight:800;font-size:1.2rem;padding:16px 32px;border:0;border-radius:999px;background:#13271b;color:#fff;cursor:pointer}
.go.wide{display:block;width:100%;margin-top:20px;background:var(--brand)}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px}
.item{display:flex;align-items:center;gap:10px;text-align:left;font:inherit;padding:12px;border-radius:16px;background:var(--card);border:1px solid var(--line);color:var(--ink);cursor:pointer;border-left:6px solid var(--c)}
.item .e{font-size:1.7rem}.item b{display:block;font-weight:600;line-height:1.2}.item small{color:var(--mute)}
.empty{color:var(--mute);padding:16px;border:1px dashed var(--line);border-radius:14px}
.back{font:inherit;font-weight:600;background:none;border:2px solid var(--line);color:var(--ink);border-radius:999px;padding:8px 16px;cursor:pointer;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--bg);border-radius:14px;padding:12px;text-align:center}.stat b{display:block;font-size:1.4rem}.stat small{color:var(--mute)}
.row{display:grid;grid-template-columns:78px 1fr 64px;gap:10px;align-items:center;padding:6px 0}.row b{text-align:right}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--c,var(--brand));border-radius:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;color:var(--ink);padding:7px 12px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-size:.95rem}
button.chip{cursor:pointer}
.note{color:var(--mute);font-size:.85rem;margin-top:18px}
.meal{border-top:6px solid var(--c)}.meal h2{margin-bottom:8px}
.entry{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.entry .e{font-size:1.5rem}.en{flex:1;min-width:0}.en b{display:block;font-weight:600;line-height:1.2}.en small{color:var(--mute)}
.qb{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:1.1rem;cursor:pointer}
.sug{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.meal .search{margin-top:12px}
.nrow{padding:10px 0;border-bottom:1px solid var(--line)}
.nt{display:flex;justify-content:space-between;gap:10px;margin-bottom:5px}.nt span{color:var(--mute)}
.nrow small{display:block;margin-top:5px}

.needbox h2{color:var(--red)}

.ta{margin-top:0!important;resize:vertical;min-height:88px;font-family:inherit}

function fmt(n){return n>=10?Math.round(n):Math.round(n*10)/10}
// Converts per-100 g data into one serving
function sv(x){
  var g,l,m;
  if(typeof x[8]==="string"){g=x[9];l=x[10];m=x[8].split(";").map(function(t){var r=/^([a-z]+)([\d.]+)$/.exec(t);return[MN[r[1]][0],parseFloat(r[2]),MN[r[1]][1]]})}
  else{var S=SERV[x[0]];g=S[0];l=S[1];m=x[8].map(function(v){var p=v[1].split(" ");return[v[0],parseFloat(p[0]),p[1]]})}
  var f=g/100;
  return{kcal:Math.round(x[2]*f),p:fmt(x[3]*f),c:fmt(x[4]*f),f:fmt(x[5]*f),fi:fmt(x[6]*f),s:fmt(x[7]*f),g:g,label:l,micro:m.map(function(v){return[v[0],fmt(v[1]*f)+" "+v[2]]})};
}

// Nutrient list for searching by nutrient (name, unit, serving key for macros, aliases)
var NUTS=[{n:"Protein",u:"g",k:"p",al:[]},{n:"Carbs",u:"g",k:"c",al:["carbohydrates","carbohydrate","carb"]},{n:"Fat",u:"g",k:"f",al:["fats"]},{n:"Fiber",u:"g",k:"fi",al:["fibre"]},{n:"Sugar",u:"g",k:"s",al:["sugars"]},{n:"Calories",u:"kcal",k:"kcal",al:["calorie","energy"]}];
Object.keys(MN).forEach(function(c){
  var nm=MN[c][0],al=[];
  if(nm.indexOf("Vitamin ")===0){var L=nm.slice(8).toLowerCase();al=[L,"vit "+L,"vit"+L,"vitamin"+L]}
  if(nm==="Folate")al=["folic acid","b9","vitamin b9"];
  NUTS.push({n:nm,u:MN[c][1],k:null,al:al});
});
function findNuts(t){
  return NUTS.filter(function(nu){
    var name=nu.n.toLowerCase();
    if(name===t||nu.al.indexOf(t)>-1)return true;
    if(t.length<3)return false;
    return name.indexOf(t)>-1||nu.al.some(function(a){return a.indexOf(t)===0});
  });
}
function amt(x,nu){
  var s=sv(x);
  if(nu.k)return s[nu.k];
  for(var i=0;i<s.micro.length;i++)if(s.micro[i][0]===nu.n)return parseFloat(s.micro[i][1]);
  return 0;
}

// Smart matching: finds foods even with typos, a different word order, partial words or other spellings
var SYN=[["aloo","alu","aaloo","potato","potatoes"],["gobi","gobhi","cauliflower"],["tea","chai"],["yogurt","yoghurt","curd","dahi"],["roti","chapati","chapatti","phulka"],["paratha","parantha","prantha","parotta","parota"],["pakora","pakoda","pakoray","pakore","fritters","bhajia"],["biryani","biriyani","briyani","biriani"],["chicken","chiken","murgh","murghi"],["mutton","lamb","gosht"],["lentil","lentils","dal","daal","dhal"],["chickpea","chickpeas","chana","chole","cholay","garbanzo"],["eggplant","aubergine","brinjal","baingan"],["okra","bhindi","ladyfinger"],["spinach","palak"],["corn","maize","makki"],["cilantro","coriander","dhania"],["donut","doughnut"],["mince","minced","keema","qeema"],["prawn","prawns","shrimp","shrimps"],["rice","chawal"],["milkshake","shake"],["kebab","kabab","kebap","kabob","kebabs"],["samosa","samosas","samosay"],["cookie","cookies","biscuit","biscuits"],["noodle","noodles"],["egg","eggs","anda","ande"],["fish","machli"],["pumpkin","kaddu"],["lauki","dudhi"],["radish","mooli","muli"],["mint","pudina"],["fenugreek","methi"],["turnip","shalgam"],["carrot","gajar"],["peas","matar","mutter"],["tomato","tomatoes","tamatar"],["onion","onions","pyaz","pyaaz"],["garlic","lehsun"],["ginger","adrak"],["milk","doodh","dudh"],["butter","makhan"],["lemon","nimbu","limbu"],["mango","mangoes","aam"],["banana","bananas","kela"],["apple","apples","seb"],["orange","oranges","santra","malta"],["pomegranate","anar"],["watermelon","tarbooz","tarbuz"],["grapes","grape","angoor"],["guava","amrood"],["dates","date","khajoor","khajur"],["coconut","nariyal"],["almond","almonds","badam"],["cashew","cashews","kaju"],["pistachio","pistachios","pista"],["peanut","peanuts","moongphali"],["sugarcane","ganna"],["lassi","lasi"],["kheer","khir"],["halwa","halva","halua"],["jalebi","jilebi"],["naan","nan"],["curry","salan","salaan"],["coffee","coffe","kofi"],["burger","burgar","burgr","burgers"],["sandwich","sandwhich","sandwitch","sandwiches"],["fried","fry"],["soup","shorba"],["salad","salaad"]];
var STOP={of:1,with:1,and:1,the:1,a:1,an:1,in:1,my:1,some:1,i:1,had:1,ate:1,piece:1,pieces:1,plate:1,bowl:1,cup:1,glass:1,serving:1,slice:1,slices:1};
var GROUP={};SYN.forEach(function(g,i){g.forEach(function(w){GROUP[w]=i})});
function toks(s){
  return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g," ").trim().split(" ").filter(function(w){return w&&!STOP[w]});
}
function lev(a,b,max){
  if(Math.abs(a.length-b.length)>max)return max+1;
  var p=[],i,j;for(j=0;j<=b.length;j++)p[j]=j;
  for(i=1;i<=a.length;i++){var c=[i];for(j=1;j<=b.length;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}
  return p[b.length];
}
function tokBase(q,n,nl){
  if(q===n)return 1;
  if(q.length>=2&&n.indexOf(q)===0)return .9;
  if(n.length>=3&&q.indexOf(n)===0)return .85;
  if(q.length>=4&&n.indexOf(q)>-1)return .7;
  if(q.length>=3&&!nl){var m=q.length>=6?2:1;if(lev(q,n,m)<=m)return q.length>=6?.75:.8}
  return 0;
}
function tokScore(q,n){
  var best=tokBase(q,n),i,s;
  if(best<1&&GROUP[n]!==undefined){
    var g=SYN[GROUP[n]];
    for(i=0;i<g.length;i++){s=g[i]===q?.95:tokBase(q,g[i])*.95;if(n===g[0])s+=.01;if(s>best)best=s}
  }
  if(best<1&&GROUP[q]!==undefined){
    var h=SYN[GROUP[q]];
    for(i=0;i<h.length;i++){s=tokBase(h[i],n,1)*.95;if(h[i].length>=5&&n.slice(-h[i].length)===h[i])s=.88;if(s>best)best=s}
  }
  return best;
}
function scoreFood(qt,name){
  var nt=toks(name);if(!qt.length||!nt.length)return[0,0,0];
  var sum=0,min=1,max=0,hit={};
  qt.forEach(function(q){var bs=0;nt.forEach(function(n,i){var s=tokScore(q,n);if(s>bs){bs=s;if(s>=.6)hit[i]=1}});sum+=bs;if(bs<min)min=bs;if(bs>max)max=bs});
  var avg=sum/qt.length,cov=Object.keys(hit).length/nt.length,sc=avg+.1*cov;
  if(min<.6)sc*=.6;
  var qj=qt.join(""),nj=nt.join("");
  if(qj.length>=4){var j=nj.indexOf(qj)>-1?.9:(lev(qj,nj,2)<=2?.85:0);if(j>sc)sc=j}
  return[sc,avg,max];
}
function rank(text){
  var qt=toks(text);if(!qt.length)return[];
  var all=allFoods().map(function(a){var s=scoreFood(qt,a[2][0]);return[a,s[0],s[1],s[2]]});
  var good=all.filter(function(r){return r[1]>=.6});
  if(!good.length)good=all.filter(function(r){return r[3]>=.8&&r[2]>=.45}).map(function(r){return[r[0],r[2]]});
  good.sort(function(x,y){return y[1]-x[1]||x[0][2][0].length-y[0][2][0].length});
  return good.slice(0,8).map(function(r){return r[0]});
}
var NUMW={one:1,two:2,three:3,four:4,five:5,six:6,half:.5,a:1,an:1};
function parseQty(s){
  var m=/^\s*(\d+(?:\.\d+)?|½|one|two|three|four|five|six|half|an?)\s*(?:x|×)?\s+(.+)$/i.exec(s);
  if(!m)return[1,s];
  var w=m[1].toLowerCase(),q=w==="½"?.5:(NUMW[w]!==undefined?NUMW[w]:parseFloat(w));
  q=Math.min(20,Math.max(.5,Math.round(q*2)/2));
  return[q,m[2]];
}
function addFood(m,a,q){
  var ex=meals[m].filter(function(r){return r[0]===a[0]&&r[1]===a[1]})[0];
  if(ex)ex[2]+=q;else meals[m].push([a[0],a[1],q]);
}
function addText(m,text){
  var miss=[];
  text.split(/,|\+|;|&|\n|\band\b/i).forEach(function(part){
    part=part.trim();if(!part)return;
    var pq=parseQty(part),r=rank(pq[1]);
    if(r.length)addFood(m,r[0],pq[0]);else miss.push(part);
  });
  drawMeal(m);
  return miss;
}
var NOMATCH=function(list){return '<small class="sub" style="color:var(--red)">No match for '+list.map(function(x){return '“'+esc(x)+'”'}).join(", ")+'. Please check the spelling or write it the way it appears in the categories (for example “Chicken biryani”), otherwise it cannot be detected.</small>'};
function suggest(m,v){
  var box=document.getElementById("s-"+m),segs=v.split(/,|\+|;|&|\n|\band\b/i),last=segs[segs.length-1].trim();
  if(!last){box.innerHTML="";return}
  var pq=parseQty(last),r=rank(pq[1]);
  if(!r.length){box.innerHTML=NOMATCH([last]);return}
  box.innerHTML='<small class="sub" style="width:100%;margin:0">Tap a food, or press Enter to add the best match.</small>'+r.map(function(a,i){
    return '<button class="chip" style="'+(i?'':'border-color:var(--brand);font-weight:600')+'" data-add="'+m+','+a[0]+','+a[1]+','+pq[0]+'">'+a[2][1]+' '+esc(a[2][0])+'</button>';
  }).join("");
}
function flushInputs(){
  var bad=false;
  Array.prototype.forEach.call(document.querySelectorAll("[data-m]"),function(inp){
    if(!inp.value.trim())return;
    var m=inp.getAttribute("data-m"),miss=addText(m,inp.value);
    if(miss.length){bad=true;inp.value=miss.join(", ");document.getElementById("s-"+m).innerHTML=NOMATCH(miss)}
    else{inp.value="";document.getElementById("s-"+m).innerHTML=""}
  });
  return bad;
}

// PAGE 5: results
var DV=[["Protein","g",50],["Carbs","g",275],["Fat","g",78],["Fiber","g",28],["Vitamin C","mg",90],["Vitamin A","µg",900],["Vitamin K","µg",120],["Vitamin E","mg",15],["Vitamin B6","mg",1.7],["Vitamin B12","µg",2.4],["Vitamin D","µg",15],["Folate","µg",400],["Calcium","mg",1000],["Iron","mg",18],["Potassium","mg",3400],["Magnesium","mg",400],["Manganese","mg",2.3],["Phosphorus","mg",700],["Selenium","µg",55],["Niacin","mg",16],["Zinc","mg",11]];
function topFoods(name){
  var nu=NUTS.filter(function(n){return n.n===name})[0];
  return allFoods().map(function(a){return[a[2][0],amt(a[2],nu)]}).sort(function(a,b){return b[1]-a[1]}).slice(0,3).map(function(a){return a[0].toLowerCase()}).join(", ");
}
function results(){
  var t={kcal:0,p:0,c:0,f:0,fi:0,s:0},mic={},per={},count=0,ent=[];
  MEAL.forEach(function(m){per[m[0]]=0;meals[m[0]].forEach(function(e){
    count++;var s=sv(DATA[e[0]].items[e[1]]),q=e[2],ev={Calories:s.kcal*q,Protein:s.p*q,Carbs:s.c*q,Fat:s.f*q,Sugar:s.s*q};ent.push([DATA[e[0]].items[e[1]][0],ev]);
    per[m[0]]+=s.kcal*q;t.kcal+=s.kcal*q;t.p+=s.p*q;t.c+=s.c*q;t.f+=s.f*q;t.fi+=s.fi*q;t.s+=s.s*q;
    s.micro.forEach(function(v){mic[v[0]]=(mic[v[0]]||0)+parseFloat(v[1])*q;ev[v[0]]=parseFloat(v[1])*q});
  })});
  if(!count){app.innerHTML='<button class="back" data-go="#/calc">← Back</button><div class="empty">Add at least one food to a meal first.</div>';return}
  var val={Protein:t.p,Carbs:t.c,Fat:t.f,Fiber:t.fi},low=[],ok=[];
  DV.forEach(function(d){var a=val[d[0]]!==undefined?val[d[0]]:(mic[d[0]]||0),pc=a/d[2]*100;(pc<100?low:ok).push([d,a,pc])});
  low.sort(function(a,b){return a[2]-b[2]});
  var LIM=[["Calories","kcal",2200,t.kcal],["Carbs","g",325,t.c],["Fat","g",100,t.f],["Sugar","g",50,t.s],["Protein","g",150,t.p],["Vitamin A","µg",3000],["Vitamin D","µg",100],["Vitamin C","mg",2000],["Vitamin E","mg",1000],["Vitamin B6","mg",100],["Calcium","mg",2500],["Iron","mg",45],["Zinc","mg",40],["Selenium","µg",400],["Manganese","mg",11],["Phosphorus","mg",4000],["Niacin","mg",35]],over=[];
  LIM.forEach(function(l){var v=l[3]!==undefined?l[3]:(mic[l[0]]||0);if(v>l[2])over.push([l,v])});
  var ovN=over.map(function(o){return o[0][0]});ok=ok.filter(function(r){return ovN.indexOf(r[0][0])<0});
  function ovH(o){var l=o[0],top=ent.filter(function(x){return x[1][l[0]]>0}).sort(function(a,b){return b[1][l[0]]-a[1][l[0]]}).slice(0,2).map(function(x){return x[0].toLowerCase()}).join(", ");
    return '<div class="nrow red"><div class="nt"><b>'+l[0]+'</b><span>'+fmt(o[1])+' '+l[1]+'</span></div><div class="bar"><i style="width:100%"></i></div><small>Above the limit of '+l[2]+' '+l[1]+'. Having this much is not okay for your health.'+(top?' Mostly from: '+top+'. Please eat less of these.':'')+'</small></div>';
  }
  function rowH(r,red){var d=r[0];
    return '<div class="nrow '+(red?'red':'ok')+'"><div class="nt"><b>'+d[0]+'</b><span>'+fmt(r[1])+' / '+d[2]+' '+d[1]+'</span></div><div class="bar"><i style="width:'+Math.min(100,r[2])+'%"></i></div>'+
      (red?'<small>You need '+fmt(d[2]-r[1])+' '+d[1]+' more. Try: '+topFoods(d[0])+'.</small>':'')+'</div>';
  }
  var perH=MEAL.map(function(m){return '<span class="chip">'+m[2]+' '+m[1]+' <b>'+Math.round(per[m[0]])+' kcal</b></span>'}).join("");
  app.innerHTML='<button class="back" data-go="#/calc">← Edit meals</button>'+
    '<section class="hero col" style="--c:var(--brand)"><div><div class="kcal">'+Math.round(t.kcal)+' kcal</div><p>Estimated total today, about '+Math.round(t.kcal/20)+'% of a 2,000 kcal day'+(t.kcal>2200?'. This is more than you need and not okay.':'')+'</p></div></section>'+
    '<div class="chips" style="margin-top:14px">'+perH+'</div>'+
    '<section class="card"><h2>What you ate</h2><div class="stats"><div class="stat"><b>'+fmt(t.p)+'g</b><small>Protein</small></div><div class="stat"><b>'+fmt(t.c)+'g</b><small>Carbs</small></div><div class="stat"><b>'+fmt(t.f)+'g</b><small>Fat</small></div></div>'+
    '<div class="chips"><span class="chip">Fiber <b>'+fmt(t.fi)+' g</b></span><span class="chip">Sugar <b>'+fmt(t.s)+' g</b></span></div></section>'+
    (over.length?'<section class="needbox"><h2>🚫 Too much today ('+over.length+')</h2><p class="sub" style="color:var(--red)">You had more than the healthy limit of these. This is not okay if it happens often.</p>'+over.map(ovH).join("")+'</section>':'')+
    (low.length?'<section class="needbox"><h2>⚠️ You still need ('+low.length+')</h2><p class="sub" style="color:var(--red)">These essential nutrients are below your daily need. Eat more of them.</p>'+low.map(function(r){return rowH(r,true)}).join("")+'</section>':'')+
    (ok.length?'<section class="card okbox"><h2>✅ Daily need reached ('+ok.length+')</h2>'+ok.map(function(r){return rowH(r,false)}).join("")+'</section>':'')+
    '<p class="note">Estimate based on the main nutrients listed for each food and typical adult daily needs. It is general information, not medical advice.</p>';
  window.scrollTo(0,0);
}

// Meta data: keeps the page title and descriptions correct for every page
var SITE_TITLE=document.title,SITE_DESC=(document.querySelector('meta[name="description"]')||{}).content||"";
function setM(sel,v){var e=document.querySelector(sel);if(e)e.setAttribute("content",v)}
function updateMeta(){
  var p=location.hash.replace(/^#\/?/,"").split("/"),t=SITE_TITLE,d=SITE_DESC;
  if(p[0]==="item"&&DATA[p[1]]&&DATA[p[1]].items[+p[2]]){
    var x=DATA[p[1]].items[+p[2]],s=sv(x);
    t=x[0]+" – calories and nutrients per serving | Nutrical";
    d=x[0]+" ("+s.label+", "+s.g+" g): "+s.kcal+" kcal, "+s.p+" g protein, "+s.c+" g carbs, "+s.f+" g fat, plus vitamins and minerals.";
  }else if(p[0]==="cat"&&DATA[p[1]]){
    var c=DATA[p[1]];
    t=c.label+" – calories and nutrients | Nutrical";
    d="Browse "+c.items.length+" foods in the "+c.label+" category with calories, protein, carbs, fat, vitamins and minerals per serving.";
  }else if(p[0]==="calc"){
    t="Daily meal calculator | Nutrical";
    d="Add your breakfast, lunch and dinner to estimate calories and nutrients, and see which essential nutrients you are missing.";
  }else if(p[0]==="results"){
    t="Your nutrition results | Nutrical";
    d="See your estimated calories, the nutrients you still need and anything you had too much of.";
  }
  document.title=t;
  setM('meta[name="description"]',d);setM('meta[property="og:title"]',t);setM('meta[property="og:description"]',d);
  setM('meta[name="twitter:title"]',t);setM('meta[name="twitter:description"]',d);
}
function route(){routeInner();updateMeta()}
function routeInner(){
  var p=location.hash.replace(/^#\/?/,"").split("/");
  if(p[0]==="item")detail(p[1],+p[2]);
  else if(p[0]==="cat"&&DATA[p[1]])category(p[1]);
  else if(p[0]==="calc")calc();
  else if(p[0]==="results")results();
  else{home();window.scrollTo(0,0)}
}
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-go]"),a=e.target.closest("[data-add]"),q=e.target.closest("[data-q]");
  if(b){if(b.getAttribute("data-go")==="#/results"&&document.querySelector("[data-m]")&&flushInputs())return;location.hash=b.getAttribute("data-go")}
  if(a){
    var p=a.getAttribute("data-add").split(","),m=p[0],ex=meals[m].filter(function(r){return r[0]===p[1]&&r[1]===+p[2]})[0];
    var qty=+p[3]||1;if(ex)ex[2]+=qty;else meals[m].push([p[1],+p[2],qty]);
    var inp=document.querySelector('[data-m="'+m+'"]');inp.value="";document.getElementById("s-"+m).innerHTML="";drawMeal(m);
  }
  if(q){
    var r=q.getAttribute("data-q").split(","),e2=meals[r[0]][+r[1]],d=+r[2];
    if(d===0)meals[r[0]].splice(+r[1],1);
    else{e2[2]+=d*.5;if(e2[2]<=0)meals[r[0]].splice(+r[1],1)}
    drawMeal(r[0]);
  }
});
window.addEventListener("hashchange",route);
route();
</script>
